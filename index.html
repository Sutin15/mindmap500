*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}

header.top{background:var(--ink);color:var(--bg)}
header.top .wrap{padding-block:18px 14px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}

.brand b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--brass)}

.tbtn:hover{border-color:var(--brass);color:var(--brass)}

.bar .wrap{padding-block:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

.search input:focus{outline:2px solid var(--brass);outline-offset:1px}
.count{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rail::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid transparent;background:var(--chip);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brass);color:var(--surface);}

.cathead .en{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border-radius:10px;overflow:hidden;border:1px solid var(--line);transition:transform .15s,border-color .15s}

.thumb{aspect-ratio:160/228;background-color:var(--chip);background-size:1000% 1000%;position:relative;max-width:100%}

.meta .th{font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

mark{background:var(--brass-soft);color:inherit;border-radius:2px}

.vtitle .s{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nav{all:unset;cursor:pointer;font-size:14px;padding:8px 14px;border-radius:10px;background:var(--chip);color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.zoom{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.zoom button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--chip);color:var(--ink);font-size:17px}

ตที่ดี อาจเริ่มจากการยอมรับสิ่งที่ควบคุมไม่ได้?","en":"The Art of Living","au":"Thich Nhat Hanh"},{"n":493,"th":"ใช้ชีวิตอย่างไรให้ไม่ต้องเสียใจในวันที่มองย้อนกลับมา?","en":"The Midnight Library","au":"Matt Haig"},{"n":494,"th":"ความสุขไม่ได้อยู่ที่การมีทุกอย่าง แต่อยู่ที่การเข้าใจชีวิต","en":"The Book of Delights","au":"Ross Gay"},{"n":495,"th":"ทำไมการใช้ชีวิตอย่างเรียบง่าย ถึงอาจเป็นความสำเร็จที่ยิ่งใหญ่ที่สุด?","en":"The Art of Stillness","au":"Pico Iyer"},{"n":496,"th":"บางครั้งชีวิตไม่ได้ต้องการคำตอบ แต่ต้องการมุมมองใหม่","en":"The School of Life: An Emotional Education","au":"The School of Life"},{"n":497,"th":"เรียนรู้ที่จะอยู่กับความไม่แน่นอน โดยไม่สูญเสียความหวัง","en":"When Things Fall Apart","au":"Pema Chödrön"},{"n":498,"th":"อย่ารอให้แก่ก่อน จึงเริ่มเข้าใจคุณค่าของเวลา","en":"Being Mortal: Medicine and What Matters in the End","au":"Atul Gawande"},{"n":499,"th":"บทเรียนชีวิตที่ไม่มีใครสอน แต่ทุกคนควรเรียนรู้","en":"The Five People You Meet in Heaven","au":"Mitch Albom"},{"n":500,"th":"ใช้ชีวิตให้คุ้มค่า ก่อนวันที่ทุกอย่างกลายเป็นเพียงความทรงจำ","en":"Tuesdays with Morrie","au":"Mitch Albom"}]};
const C=DATA.cats, B=DATA.books;
const catOf=n=>Math.ceil(n/10);
const pageOf=n=>String(n+27).padStart(3,'0');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=new Set(store.get('mm500-favs',[]));
let filter=store.get('mm500-filter','all');
const SPECIAL={intro:{img:'027',t:'คำนำ',s:'500 Mindmap'},cover:{img:'001',t:'ปก',s:'500 Mindmap'},back:{img:'528',t:'ปกหลัง',s:'500 Mindmap'}};

const norm=s=>(s||'').toLowerCase().replace(/\s+/g,'');
B.forEach(b=>{b.key=norm(b.th+'|'+b.en+'|'+b.au);b.c=catOf(b.n)});

const rail=document.getElementById('rail');
function chips(){
  const items=[['all','ทั้งหมด'],['fav','★ ที่บันทึกไว้'],...C.map(c=>[String(c.no),c.no+' · '+c.th])];
  rail.innerHTML=items.map(([v,l])=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${filter===v}">${l}</button>`).join('');
}
rail.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.v;store.set('mm500-filter',filter);chips();render();window.scrollTo({top:0})});

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s,q){s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)}
function thumbStyle(n){const i=(n-1)%100,k=Math.floor((n-1)/100);return `background-image:url(s/${k}.webp);background-position:${(i%10)/9*100}% ${Math.floor(i/10)/9*100}%`}
function card(b,q){return `<button class="card" type="button" data-n="${b.n}"><div class="thumb" style="${thumbStyle(b.n)}"><span class="n">${b.n}</span>${favs.has(b.n)?'<span class="fav">★</span>':''}</div><div class="meta"><div class="th">${hl(b.th,q)}</div><div class="en">${hl(b.en,q)}</div><div class="au">${hl(b.au,q)}</div></div></button>`}

const list=document.getElementById('list'), qEl=document.getElementById('q'), countEl=document.getElementById('count');
let shown=[];
function render(){
  const raw=qEl.value.trim(), q=norm(raw);
  let rows=B;
  if(filter==='fav')rows=rows.filter(b=>favs.has(b.n));
  else if(filter!=='all')rows=rows.filter(b=>b.c===+filter);
  if(q)rows=/^\d+$/.test(q)?rows.filter(b=>String(b.n)===q||b.key.includes(q)):rows.filter(b=>b.key.includes(q));
  shown=rows.map(b=>b.n);
  countEl.textContent=rows.length+' เล่ม';
  if(!rows.length){list.innerHTML=`<div class="empty">${filter==='fav'&&!q?'ยังไม่มีเล่มที่บันทึกไว้ · เปิดเล่มแล้วกด ☆ ด้านบนขวา':'ไม่พบหนังสือที่ตรงกับ “'+esc(raw)+'”'}</div>`;return}
  let html='',cur=0,open=false;
  for(const b of rows){
    if(b.c!==cur){if(open)html+='</div>';cur=b.c;const c=C[cur-1];html+=`<div class="cathead"><span class="no">${String(cur).padStart(2,'0')}</span><h2>${esc(c.th)}</h2><span class="en">${esc(c.en)}</span></div><div class="grid">`;open=true}
    html+=card(b,raw);
  }
  list.innerHTML=html+'</div>';
}
let t;qEl.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(render,120)});
list.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)go('b'+c.dataset.n)});

/* reader */
const V=document.getElementById('viewer'),img=document.getElementById('vImg'),stage=document.getElementById('stage');
let curN=null,zoom=1;
function setZoom(z,cx,cy){
  const old=zoom;zoom=Math.min(4,Math.max(1,Math.round(z*100)/100));
  stage.classList.toggle('zoomed',zoom>1);
  const base=Math.min(stage.clientWidth,820);
  const fx=cx==null?.5:(stage.scrollLeft+cx)/stage.scrollWidth, fy=cy==null?.5:(stage.scrollTop+cy)/stage.scrollHeight;
  img.style.width=zoom>1?base*zoom+'px':'';
  document.getElementById('zLbl').textContent=Math.round(zoom*100)+'%';
  if(old!==zoom){stage.scrollLeft=fx*stage.scrollWidth-(cx??stage.clientWidth/2);stage.scrollTop=fy*stage.scrollHeight-(cy??stage.clientHeight/2)}
}
document.getElementById('zIn').onclick=()=>setZoom(zoom+.5);
document.getElementById('zOut').onclick=()=>setZoom(zoom-.5);
let lastTap=0;
stage.addEventListener('click',e=>{const now=Date.now();if(now-lastTap<300){const r=stage.getBoundingClientRect();setZoom(zoom>1?1:2.2,e.clientX-r.left,e.clientY-r.top)}lastTap=now});
/* pinch */
const pts=new Map();let pinch0=null;
stage.addEventListener('pointerdown',e=>{pts.set(e.pointerId,e)});
stage.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const r=stage.getBoundingClientRect();if(!pinch0)pinch0={d,z:zoom};else setZoom(pinch0.z*d/pinch0.d,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top)}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null}));
stage.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
/* swipe when not zoomed */
let sx=null,sy=null;
stage.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}else sx=null},{passive:true});
stage.addEventListener('touchend',e=>{if(sx==null||zoom>1)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1);sx=null});

function seq(){return shown.length?shown:B.map(b=>b.n)}
function step(d){if(curN==null)return;const s=seq();let i=s.indexOf(curN);if(i<0)i=0;const j=i+d;if(j>=0&&j<s.length)go('b'+s[j])}
document.getElementById('vPrev').onclick=()=>step(-1);
document.getElementById('vNext').onclick=()=>step(1);
document.getElementById('vClose').onclick=()=>go('');
/* save mindmap as JPG image */
let dl=null;
(async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}})();
const saveBtn=document.getElementById('vSave');
function safeName(s){return s.replace(/[\\/:*?"<>|#%]+/g,'').replace(/\s+/g,' ').trim().slice(0,60)}
async function toJpg(url){
  const blob=await (await fetch(url)).blob();
  const bmp=await createImageBitmap(blob);
  const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));
}
saveBtn.onclick=async()=>{
  if(saveBtn.disabled)return;
  const n=curN, h=location.hash.slice(1);
  const name=n?`Mindmap-${String(n).padStart(3,'0')}-${safeName(B[n-1].th)}.jpg`:`Mindmap-${h}.jpg`;
  saveBtn.disabled=true;saveBtn.style.opacity=.5;toast('กำลังเตรียมรูป…');
  try{
    const jpg=await toJpg(img.src);
    if(dl){
      try{await dl.save({filename:name,data:jpg});toast('บันทึกรูปแล้ว')}
      catch(e){toast(e&&e.code==='declined'?'ยกเลิกการบันทึก':(e&&e.code==='rate_limited'?'รอสักครู่แล้วลองใหม่':'บันทึกไม่ได้ในหน้านี้ · กดค้างที่รูปเพื่อบันทึกแทน'))}
    }else if(window.claude){toast('กดค้างที่รูปแล้วเลือก “บันทึกรูปภาพ”')}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(jpg);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('บันทึกรูปแล้ว')}
  }catch(e){toast('โหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง')}
  finally{saveBtn.disabled=false;saveBtn.style.opacity=''}
};
const favBtn=document.getElementById('vFav');
favBtn.onclick=()=>{if(curN==null)return;favs.has(curN)?favs.delete(curN):favs.add(curN);store.set('mm500-favs',[...favs]);paintFav();toast(favs.has(curN)?'บันทึกเล่มนี้แล้ว':'เอาออกจากที่บันทึกแล้ว');render()};
function paintFav(){const on=favs.has(curN);favBtn.textContent=on?'★':'☆';favBtn.classList.toggle('on',on)}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,1600)}

function openView(id){
  let src,tt,ss;
  if(/^b\d+$/.test(id)){const n=+id.slice(1),b=B[n-1];if(!b)return closeView();curN=n;src=pageOf(n);tt=`${n}. ${b.th}`;ss=`${b.en} · ${b.au}`;favBtn.hidden=false;paintFav();store.set('mm500-last',n);
    const s=seq(),i=s.indexOf(n);document.getElementById('vPrev').disabled=i<=0;document.getElementById('vNext').disabled=i<0||i>=s.length-1;
    [s[i-1],s[i+1]].forEach(m=>{if(m){const p=new Image();p.src='p/'+pageOf(m)+'.webp'}});
  }else if(SPECIAL[id]){const x=SPECIAL[id];curN=null;src=x.img;tt=x.t;ss=x.s;favBtn.hidden=true;document.getElementById('vPrev').disabled=true;document.getElementById('vNext').disabled=true}
  else return closeView();
  img.src='p/'+src+'.webp';img.alt=tt;
  document.getElementById('vT').textContent=tt;document.getElementById('vS').textContent=ss;
  V.hidden=false;document.body.style.overflow='hidden';setZoom(1);stage.scrollTop=0;
}
function closeView(){V.hidden=true;document.body.style.overflow='';curN=null}
function go(id){if(location.hash.slice(1)===id){route();return}location.hash=id;if(!id)route()}
function route(){const h=location.hash.slice(1);h?openView(h):closeView()}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(V.hidden)return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else if(e.key==='Escape')go('')});
document.getElementById('btnRandom').onclick=()=>{const s=seq();go('b'+s[Math.floor(Math.random()*s.length)])};
document.getElementById('btnIntro').onclick=()=>go('intro');

chips();render();route();
const sel=rail.querySelector('[aria-pressed="true"]');if(sel)sel.scrollIntoView({inline:'center',block:'nearest'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
